<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Entrar | Luméa</title><link rel="icon" href="/lumea-mark.svg"><link rel="stylesheet" href="/painel.css"></head>
<body><main class="auth-card"><a href="/" class="back">← Voltar ao site</a><div class="brand">LUMÉA</div><h1>Acesso administrativo</h1><p>Entre para consultar os cadastros recebidos no site.</p>
<form id="login"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<section id="setup-box" hidden><h2>Primeiro acesso</h2><p>Preencha o código de instalação criado no Cloudflare. O primeiro administrador é cadastrado uma única vez.</p><form id="setup"><label>Código de instalação<input name="setupToken" type="password" required></label><label>E-mail de administrador<input name="email" type="email" autocomplete="username" required></label><label>Nova senha (mín. 12 caracteres)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><button>Criar administrador</button></form></section><p id="message" role="status"></p></main><script type="module" src="/login.js"></script></body></html>
